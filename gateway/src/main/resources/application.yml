server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: transaction-aggregation-gateway

  lifecycle:
    timeout-per-shutdown-phase: 20s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: transaction-aggregation
              uri: ${AGGREGATION_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/transactions,/api/v1/transactions/**

app:
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:http://localhost:8180/realms/transaction-platform}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8180/realms/transaction-platform/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
