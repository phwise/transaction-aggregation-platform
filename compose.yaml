
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d transactions"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  aggregation:
    build:
      context: .
      dockerfile: Dockerfile.aggregation
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactions
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AGGREGATION_URL: http://aggregation:8082
    depends_on:
      - aggregation
    restart: unless-stopped

volumes:
  postgres_data:
