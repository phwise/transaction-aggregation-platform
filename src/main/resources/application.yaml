
spring:
  application:
    name:  transaction-aggregation-api

  datasource:
    url: jdbc:postgresql://localhost:5432/companies?ApplicationName=WiseInvestmentCompanies
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: "Tlotliso1819!!"

    hikari:
      pool-name: WiseInvestmentCompaniesPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: tru

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

server:
  port: 8082

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.batch: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.data.jpa.repository.query: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always