spring:
  application:
    name: transaction-aggregation

  datasource:
    url: jdbc:postgresql://localhost:5432/transactions
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD}

    hikari:
      pool-name: TransactionAggregationPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:http://localhost:8180/realms/transaction-platform}
      jwk-set-uri: ${APP_SECURITY_JWT_JWK_SET_URI:http://localhost:8180/realms/transaction-platform/protocol/openid-connect/certs}
  mock-providers:
    snapbank:
      mode: OK
    cashflow:
      mode: OK
    fastpay:
      mode: OK
  idempotency:
    lease-seconds: 300

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.capitec: INFO