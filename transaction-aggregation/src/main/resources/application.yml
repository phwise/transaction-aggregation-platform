
spring:
  application:
    name: transaction-aggregation

  datasource:
    url: jdbc:postgresql://localhost:5432/aggregation-api?ApplicationName=aggregation-api
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: "Tlotliso1819!!"

    hikari:
      pool-name: TransactionAggregationPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    validate-migration-naming: true
    locations: classpath:db/migration

app:
  mock-providers:
    snapbank:
      mode: OK
    cashflow:
      mode: OK
    fastpay:
      mode: OK
  idempotency:
    lease-seconds: 300

server:
  port: 8082

